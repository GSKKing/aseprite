name: Build Aseprite
on: [workflow_dispatch, push]  # 支持手动或推送时触发
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - uses: ilammy/msvc-dev-cmd@v1   # 安装 MSVC 编译器
      - name: Download Skia
        run: |
          curl -L https://github.com/aseprite/skia/releases/latest/download/Skia-Windows-Release-x64.zip -o skia.zip
          7z x skia.zip -o./skia
      - name: Configure and Build
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=RelWithDebInfo -DLAF_BACKEND=skia -DSKIA_DIR=../skia -DSKIA_LIBRARY_DIR=../skia/out/Release-x64 -DSKIA_LIBRARY=../skia/out/Release-x64/skia.lib -G Ninja ..
          ninja aseprite
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aseprite
          path: build/bin/aseprite.exe
